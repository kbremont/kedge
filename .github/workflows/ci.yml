name: ci

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: gofmt -l cmd internal tools | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Both tools are pinned by the tool block in server/go.mod.
      - run: go tool templ generate && go tool sqlc generate
      - run: git diff --exit-code

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: false
          load: true
          tags: 531-tracker:pr
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name smoke -e AUTH_PASSWORD=ci -p 3000:3000 531-tracker:pr
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs smoke; exit 1
