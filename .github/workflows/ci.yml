name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEMPL_VERSION: v0.3.1020
  SQLC_VERSION: v1.31.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l cmd internal tools | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}
      - run: templ generate && sqlc generate
      - run: git diff --exit-code

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: 531-tracker:pr
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name smoke -e AUTH_PASSWORD=ci -p 3000:3000 531-tracker:pr
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs smoke; exit 1
