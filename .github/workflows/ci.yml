name: ci

on:
  pull_request:
    paths:
      - "server/**"
      - "mobile/src/api/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: gofmt -l cmd internal tools | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      # The generators are pinned by the tool block in server/go.mod and, for
      # openapi-typescript, by mobile/package.json. This covers templ, sqlc,
      # the API server from its spec, and the app's schema.gen.ts and
      # fixtures.
      - run: make generate
        working-directory: .
      # git diff alone would miss a new fixture, which is untracked.
      - run: git status --porcelain && test -z "$(git status --porcelain)"
        working-directory: .

  # An installed app is not updated along with the server, so a change to the
  # API must not break it. oasdiff compares the spec with the base branch's
  # and fails on a breaking change, unless the PR also changes info.version
  # (and APIVersion with it), which is how a deliberate break is
  # acknowledged: the app checks the version through info.
  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: oasdiff breaking
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --depth=1 origin "$BASE"
          base="$RUNNER_TEMP/base-openapi.yaml"
          if ! git show FETCH_HEAD:server/api/openapi.yaml > "$base" 2>/dev/null; then
            echo "$BASE has no spec yet, so there is nothing to break."
            exit 0
          fi
          version=$(go tool oasdiff diff "$base" api/openapi.yaml --format json | jq -c '.info.version // empty')
          if [ -n "$version" ]; then
            echo "info.version changed ($version), so breaking changes are acknowledged:"
            go tool oasdiff breaking "$base" api/openapi.yaml
            exit 0
          fi
          go tool oasdiff breaking "$base" api/openapi.yaml --fail-on ERR

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: false
          load: true
          tags: 531-tracker:pr
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name smoke -e AUTH_PASSWORD=ci -p 3000:3000 531-tracker:pr
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs smoke; exit 1
