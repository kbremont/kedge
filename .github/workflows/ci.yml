name: ci

on:
  pull_request:
    paths:
      - "server/**"
      - "mobile/src/api/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: gofmt -l cmd internal tools | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      # The generators are pinned by the tool block in server/go.mod and, for
      # openapi-typescript, by mobile/package.json. This covers templ, sqlc,
      # the API server from its spec, and the app's schema.gen.ts and
      # fixtures.
      - run: make generate
        working-directory: .
      # git diff alone would miss a new fixture, which is untracked.
      - run: git status --porcelain && test -z "$(git status --porcelain)"
        working-directory: .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: false
          load: true
          tags: 531-tracker:pr
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name smoke -e AUTH_PASSWORD=ci -p 3000:3000 531-tracker:pr
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs smoke; exit 1
